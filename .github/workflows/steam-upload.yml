# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 3. Upload to Steam

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: "Successful Release Tauri Builds run ID"
        required: true
        type: string

jobs:
  upload:
    name: Upload to Steam
    runs-on: ubuntu-22.04
    environment: steam-beta
    defaults:
      run:
        shell: bash
    env:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Steam credentials are set
        run: |
          if [ -z "$STEAM_USERNAME" ] || [ -z "$STEAM_PASSWORD" ]; then
            echo "::error::STEAM_USERNAME and STEAM_PASSWORD secrets must be set"
            exit 1
          fi

      # ---- Download artifacts after authentication checks pass ----
      - name: Download Steam-ready folders
        uses: actions/download-artifact@v4
        with:
          name: steam-release-folders
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.release_run_id }}

      - name: Extract Steam-ready folders
        run: |
          set -euo pipefail
          tar -xzf artifacts/steam-release-folders.tar.gz

      - name: Verify release folders
        run: |
          set -euo pipefail
          echo "=== Release folder contents ==="
          find release -type f | head -20 || true

          # Verify required folders exist and have content
          for platform in macos linux win64; do
            if [ ! -d "release/$platform/Sixarata" ]; then
              echo "::error::Missing release/$platform/Sixarata folder"
              exit 1
            fi
          done

          test -x release/macos/Sixarata/Sixarata.app/Contents/MacOS/app || {
            echo "::error::macOS entrypoint is not executable"
            exit 1
          }
          test -x release/linux/Sixarata/Sixarata.AppImage || {
            echo "::error::Linux entrypoint is not executable"
            exit 1
          }
          test -f release/win64/Sixarata/Sixarata.exe || {
            echo "::error::Windows entrypoint is missing"
            exit 1
          }

      - name: Upload to Steam (steamcmd in Docker)
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            cm2network/steamcmd \
            bash -lc '/home/steam/steamcmd/steamcmd.sh \
              +@ShutdownOnFailedCommand 1 \
              +@NoPromptForPassword 1 \
              +login "'"$STEAM_USERNAME"'" "'"$STEAM_PASSWORD"'" \
              +run_app_build steam/build_app.vdf \
              +quit'
